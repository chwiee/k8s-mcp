name: ci-deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected overlay after publishing the image
        required: false
        default: false
        type: boolean
      environment:
        description: Kustomize overlay to deploy
        required: false
        default: dev
        type: choice
        options:
          - dev
          - prod

env:
  GO_VERSION: 1.24.13
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: go test ./...
      - name: Build binary
        run: go build ./...

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: docker build -t "$IMAGE_NAME:${GITHUB_SHA}" -t "$IMAGE_NAME:latest" .
      - name: Push image
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"
      - name: Store image reference
        id: meta
        run: echo "image=$IMAGE_NAME:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    needs: publish
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install kubectl
        run: |
          curl -fsSLo kubectl "https://dl.k8s.io/release/v1.33.2/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
      - name: Deploy overlay
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image }}
        run: |
          kubectl kustomize "k8s/overlays/${{ inputs.environment }}" | sed "s#ghcr.io/chwiee/k8s-mcp:latest#$IMAGE_NAME#g" | kubectl apply -f -
